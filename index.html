<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>UK Marvel Streaming Checklist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0e14;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .checkbox-custom:checked + .item-content .item-title {
      text-decoration: line-through;
      color: #6b7280;
    }
    .checkbox-custom:checked + .item-content {
      opacity: 0.75;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #111827;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- Sticky Header & Progress Bar -->
  <header class="sticky top-0 z-30 bg-[#111622]/95 backdrop-blur-md border-b border-gray-800 shadow-xl">
    <div class="max-w-4xl mx-auto px-4 py-4">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
          <div class="flex items-center gap-2">
            <span class="bg-red-600 text-white text-xs font-black tracking-wider px-2 py-0.5 rounded uppercase">Marvel</span>
            <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">UK Streaming Checklist</h1>
          </div>
          <p class="text-xs text-gray-400 mt-0.5">Disney+ UK &amp; Netflix UK • Release Order (1979–2026)</p>
        </div>

        <div class="flex items-center gap-3">
          <div class="text-right">
            <div class="text-sm font-bold text-white" id="progress-text">0 / 0 Watched</div>
            <div class="text-xs text-red-400 font-medium" id="progress-percent">0% Complete</div>
          </div>
          <button id="reset-btn" onclick="handleResetClick()" class="text-xs bg-gray-800 hover:bg-red-900/60 text-gray-300 hover:text-red-200 border border-gray-700 px-3 py-1.5 rounded-lg transition">
            Reset
          </button>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="w-full bg-gray-800 rounded-full h-2.5 mt-3 overflow-hidden">
        <div id="progress-bar" class="bg-gradient-to-r from-red-600 to-red-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>

      <!-- Search & Filters -->
      <div class="mt-4 flex flex-col sm:flex-row gap-2">
        <div class="relative flex-1">
          <input
            type="text"
            id="search-input"
            placeholder="Search movies, series, specials..."
            class="w-full bg-gray-900 border border-gray-700 text-sm text-white rounded-lg pl-9 pr-3 py-2 focus:outline-none focus:border-red-500"
          />
          <svg class="w-4 h-4 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>

        <div class="flex flex-wrap gap-1.5">
          <button onclick="setFilter('all')" id="filter-all" class="filter-btn active px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-600 text-white transition">All</button>
          <button onclick="setFilter('unwatched')" id="filter-unwatched" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-800 text-gray-300 hover:bg-gray-700 transition">To Watch</button>
          <button onclick="setFilter('watched')" id="filter-watched" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-800 text-gray-300 hover:bg-gray-700 transition">Watched</button>
          <button onclick="setFilter('netflix')" id="filter-netflix" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-800 text-gray-300 hover:bg-gray-700 transition">Netflix UK</button>
          <button onclick="setFilter('mcu')" id="filter-mcu" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-800 text-gray-300 hover:bg-gray-700 transition">MCU Only</button>
          <button onclick="setFilter('specials')" id="filter-specials" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-800 text-gray-300 hover:bg-gray-700 transition">Specials &amp; Docs</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-8" id="checklist-container">

  </main>

    const STORAGE_KEY = "uk_marvel_checklist_v2";
    let checkedItems = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    let currentFilter = "all";
    let searchQuery = "";
    let resetConfirmPending = false;
    let resetTimer = null;

    function getItemId(eraIdx, itemIdx) {
      return `item_${eraIdx}_${itemIdx}`;
    }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(checkedItems));
      updateStats();
    }

    function toggleItem(id) {
      if (checkedItems[id]) {
        delete checkedItems[id];
      } else {
        checkedItems[id] = true;
      }
      saveProgress();
      if (currentFilter === "watched" || currentFilter === "unwatched") {
        renderList();
      }
    }

    function toggleEraAll(eraIdx, check) {
      const era = marvelData[eraIdx];
      era.items.forEach((_, itemIdx) => {
        const id = getItemId(eraIdx, itemIdx);
        if (check) {
          checkedItems[id] = true;
        } else {
          delete checkedItems[id];
        }
      });
      saveProgress();
      renderList();
    }

    function handleResetClick() {
      const btn = document.getElementById("reset-btn");
      if (!resetConfirmPending) {
        resetConfirmPending = true;
        btn.textContent = "Confirm Clear?";
        btn.classList.remove("bg-gray-800", "text-gray-300");
        btn.classList.add("bg-red-600", "text-white", "border-red-500");
        resetTimer = setTimeout(() => {
          resetConfirmPending = false;
          btn.textContent = "Reset";
          btn.classList.remove("bg-red-600", "text-white", "border-red-500");
          btn.classList.add("bg-gray-800", "text-gray-300");
        }, 3500);
      } else {
        clearTimeout(resetTimer);
        resetConfirmPending = false;
        btn.textContent = "Reset";
        btn.classList.remove("bg-red-600", "text-white", "border-red-500");
        btn.classList.add("bg-gray-800", "text-gray-300");
        checkedItems = {};
        saveProgress();
        renderList();
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.remove("bg-red-600", "text-white");
        btn.classList.add("bg-gray-800", "text-gray-300");
      });
      const activeBtn = document.getElementById(`filter-${filter}`);
      activeBtn.classList.remove("bg-gray-800", "text-gray-300");
      activeBtn.classList.add("bg-red-600", "text-white");
      renderList();
    }

    function updateStats() {
      let total = 0;
      let watched = 0;
      marvelData.forEach((era, eraIdx) => {
        era.items.forEach((_, itemIdx) => {
          total++;
          if (checkedItems[getItemId(eraIdx, itemIdx)]) {
            watched++;
          }
        });
      });
      const pct = total > 0 ? Math.round((watched / total) * 100) : 0;
      document.getElementById("progress-text").textContent = `${watched} / ${total} Watched`;
      document.getElementById("progress-percent").textContent = `${pct}% Complete`;
      document.getElementById("progress-bar").style.width = `${pct}%`;
    }

    function getPlatformBadges(platform) {
      if (platform === "Disney+ UK / Netflix UK") {
        return `
          <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-blue-950 text-blue-300 border border-blue-800/60">Disney+ UK</span>
          <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-red-950 text-red-300 border border-red-800/60">Netflix UK</span>
        `;
      } else if (platform === "Netflix UK") {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-red-950 text-red-300 border border-red-800/60">Netflix UK</span>`;
      } else {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-blue-950 text-blue-300 border border-blue-800/60">Disney+ UK</span>`;
      }
    }

    function renderList() {
      const container = document.getElementById("checklist-container");
      container.innerHTML = "";
      let globalNumber = 0;
      let anyVisible = false;

      marvelData.forEach((era, eraIdx) => {
        const eraItems = [];
        let eraWatchedCount = 0;

        era.items.forEach((item, itemIdx) => {
          globalNumber++;
          const id = getItemId(eraIdx, itemIdx);
          const isChecked = !!checkedItems[id];
          if (isChecked) eraWatchedCount++;

          // Filtering
          const matchesSearch =
            item.title.toLowerCase().includes(searchQuery) ||
            item.meta.toLowerCase().includes(searchQuery);

          let matchesFilter = true;
          if (currentFilter === "watched") matchesFilter = isChecked;
          if (currentFilter === "unwatched") matchesFilter = !isChecked;
          if (currentFilter === "netflix") matchesFilter = item.platform.includes("Netflix UK");
          if (currentFilter === "mcu") matchesFilter = item.meta.includes("MCU");
          if (currentFilter === "specials") {
            matchesFilter =
              item.meta.includes("Special") ||
              item.meta.includes("Short") ||
              item.meta.includes("Documentary");
          }

          if (matchesSearch && matchesFilter) {
            eraItems.push({ ...item, id, isChecked, number: globalNumber });
          }
        });

        if (eraItems.length === 0) return;
        anyVisible = true;

        const allEraChecked = eraWatchedCount === era.items.length;

        const section = document.createElement("section");
        section.className = "bg-[#131926] border border-gray-800/90 rounded-2xl overflow-hidden shadow-lg";

        section.innerHTML = `
          <div class="bg-[#182030] px-4 py-3.5 border-b border-gray-800 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
            <div>
              <h2 class="text-base sm:text-lg font-bold text-white">${era.era}</h2>
              <p class="text-xs text-gray-400">${eraWatchedCount} of ${era.items.length} completed</p>
            </div>
            <button
              onclick="toggleEraAll(${eraIdx}, ${!allEraChecked})"
              class="self-start sm:self-auto text-xs font-medium px-3 py-1 rounded-md bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 transition"
            >
              ${allEraChecked ? "Untick Era" : "Tick Entire Era"}
            </button>
          </div>
          <div class="divide-y divide-gray-800/60">
            ${eraItems.map(item => `
              <label class="flex items-start sm:items-center gap-3.5 px-4 py-3 hover:bg-gray-800/40 cursor-pointer transition select-none">
                <input
                  type="checkbox"
                  class="checkbox-custom mt-1 sm:mt-0 w-5 h-5 rounded border-gray-600 bg-gray-900 text-red-600 focus:ring-red-500 focus:ring-offset-gray-900 cursor-pointer accent-red-600"
                  ${item.isChecked ? "checked" : ""}
                  onchange="toggleItem('${item.id}')"
                />
                <div class="item-content flex-1 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1.5 transition-opacity">
                  <div>
                    <span class="text-xs font-mono text-gray-500 mr-1.5">#${item.number}</span>
                    <span class="item-title text-sm sm:text-base font-semibold text-gray-100">${item.title}</span>
                    <span class="block sm:inline text-xs text-gray-400 sm:ml-2">${item.meta}</span>
                  </div>
                  <div class="flex flex-wrap gap-1.5 shrink-0">
                    ${getPlatformBadges(item.platform)}
                  </div>
                </div>
              </label>
            `).join("")}
          </div>
        `;

        container.appendChild(section);
      });

      if (!anyVisible) {
        container.innerHTML = `
          <div class="text-center py-12 bg-[#131926] border border-gray-800 rounded-2xl">
            <p class="text-gray-400 text-sm">No Marvel titles match your current search or filter.</p>
          </div>
        `;
      }
    }

    document.getElementById("search-input").addEventListener("input", (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      renderList();
    });

    // Init
    updateStats();
    renderList();
  </script>
</body>
  </html>
